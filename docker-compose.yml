version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bs-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: business_suite
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bs-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: bs-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DEPLOYMENT_MODE: SAAS
      DATABASE_URL: postgresql://postgres:postgrespassword2026@postgres:5432/business_suite?schema=public
      JWT_SECRET: super-secret-production-jwt-key-2026
      REFRESH_TOKEN_SECRET: super-secret-production-refresh-key-2026
      CORS_ORIGIN: http://localhost:3000
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: bs-web
    restart: always
    depends_on:
      - api
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads_data:
